name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          provenance: true

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          if ! npm publish --provenance --access public; then
            cat ~/.npm/_logs/*.log
            exit 1
          fi